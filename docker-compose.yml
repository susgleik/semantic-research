networks:
  semantic-search-net:
    name: semantic-search-net
    driver: bridge

services:

  # ── LocalStack — emulador local de S3 ────────────────────────────────────────
  # Emula: buckets docs/reports/frontend, PutObject/GetObject/CopyObject/DeleteObject,
  # URLs prefirmadas (GetPreSignedURL)
  # NO emula: eventos S3 -> Lambda (ver nota en docs/architecture.md); eso se
  # reemplaza localmente por la invocación directa upload-service -> indexer-service.
  localstack:
    image: localstack/localstack:3.8
    container_name: semantic-search-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
      LOCALSTACK_AUTH_TOKEN: ""
      DISABLE_EVENTS: 1
    volumes:
      - localstack-data:/var/lib/localstack
    networks:
      - semantic-search-net

  # ── DynamoDB Local — emulador oficial de AWS para DynamoDB ───────────────────
  # Mismo IAmazonDynamoDB / IDynamoDBContext que en AWS real, sin cambios de código.
  # Corre en memoria (-inMemory): no persiste entre reinicios, mismo criterio que
  # LocalStack para desarrollo local; evita el problema de permisos del volumen
  # con el usuario no-root de la imagen en Docker Desktop/Windows.
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: semantic-search-dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    working_dir: /home/dynamodblocal
    networks:
      - semantic-search-net

  # ── Setup — crea el bucket S3 y la tabla DynamoDB al levantar el stack ───────
  setup:
    image: amazon/aws-cli:latest
    container_name: semantic-search-setup
    depends_on:
      - localstack
      - dynamodb-local
    networks:
      - semantic-search-net
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url=http://localstack:4566 s3 ls >/dev/null 2>&1; do sleep 1; done
        until aws --endpoint-url=http://dynamodb-local:8000 dynamodb list-tables >/dev/null 2>&1; do sleep 1; done
        aws --endpoint-url=http://localstack:4566 s3 mb s3://docs || true
        aws --endpoint-url=http://localstack:4566 s3 mb s3://reports || true
        aws --endpoint-url=http://dynamodb-local:8000 dynamodb create-table \
          --table-name chunks \
          --attribute-definitions AttributeName=DocumentId,AttributeType=S AttributeName=ChunkId,AttributeType=S \
          --key-schema AttributeName=DocumentId,KeyType=HASH AttributeName=ChunkId,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST || true
        echo "Setup local listo: bucket docs/reports + tabla chunks"

volumes:
  localstack-data:
