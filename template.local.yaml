AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Entorno local (sin AWS) para probar la topologia de microservicios completa.
  Ver docs/architecture.md#entorno-local-docker-compose---desarrollo-sin-aws.

  Uso:
    1. docker compose up -d          (LocalStack + DynamoDB Local + setup de bucket/tabla)
    2. sam build --template template.local.yaml
    3. sam local start-api --template template.local.yaml \
         --docker-network semantic-search-net --env-vars env.local.json

Globals:
  # Réplica del cors_configuration real de infra/apigateway.tf. OJO: esto NO hace que
  # sam local start-api responda el preflight OPTIONS — es un límite conocido y sin
  # fix de SAM CLI cuando la API es la implícita (Type: HttpApi en cada evento, sin
  # AWS::Serverless::HttpApi declarado a mano): local necesita un DefinitionBody de
  # OpenAPI inline para poder sintetizar esa respuesta, la implícita no lo genera
  # (https://github.com/aws/aws-sam-cli/issues/3803, /issues/3864). El fix real para
  # que el frontend funcione contra el backend local está en frontend/src/api/client.ts
  # (evitar disparar preflight desde el navegador en primer lugar). Se deja esta config
  # igual porque es inofensiva y agrega los headers CORS a la respuesta real del Lambda.
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - "http://localhost:5173"
        - "http://127.0.0.1:5173"
      AllowMethods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      AllowHeaders:
        - authorization
        - content-type
      MaxAge: 300

  Function:
    Runtime: dotnet8
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        AWS_REGION: us-east-1
        S3_BUCKET_DOCS: docs
        S3_BUCKET_REPORTS: reports
        S3_SERVICE_URL: http://localstack:4566
        DYNAMODB_TABLE_NAME: chunks
        DYNAMODB_SERVICE_URL: http://dynamodb-local:8000
        QUERY_CACHE_TABLE_NAME: query-cache
        QUERY_CACHE_TTL_SECONDS: "600"
        GEMINI_EMBEDDING_MODEL: gemini-embedding-001
        GEMINI_CHAT_MODEL: gemini-flash-latest
        GEMINI_EMBEDDING_DIMENSIONS: "768"
        # Placeholder vacío: el valor real lo inyecta env.local.json vía --env-vars
        # (--env-vars solo sobrescribe variables que ya existen en el template).
        GEMINI_API_KEY: ""

Resources:

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/SemanticSearch.Functions.Upload/
      Handler: SemanticSearch.Functions.Upload::SemanticSearch.Functions.Upload.UploadFunction::FunctionHandler
      Events:
        Upload:
          Type: HttpApi
          Properties:
            Path: /upload
            Method: post

  # Sin ruta HTTP: en AWS real la dispara un S3 Event Notification (s3:ObjectCreated:*).
  # Local: se invoca directo con
  #   sam local invoke IndexerFunction --template template.local.yaml \
  #     --event events/s3-put-event.json --docker-network semantic-search-net --env-vars env.local.json
  # (upload-service NO la invoca automaticamente en local; ver nota en docs/architecture.md)
  IndexerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/SemanticSearch.Functions.Indexer/
      Handler: SemanticSearch.Functions.Indexer::SemanticSearch.Functions.Indexer.IndexerFunction::FunctionHandler

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/SemanticSearch.Functions.Query/
      Handler: SemanticSearch.Functions.Query::SemanticSearch.Functions.Query.QueryFunction::FunctionHandler
      Events:
        Query:
          Type: HttpApi
          Properties:
            Path: /query
            Method: post

  DocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/SemanticSearch.Functions.Documents/
      Handler: SemanticSearch.Functions.Documents::SemanticSearch.Functions.Documents.DocumentsFunction::FunctionHandler
      Events:
        List:
          Type: HttpApi
          Properties:
            Path: /documents
            Method: get
        Reindex:
          Type: HttpApi
          Properties:
            Path: /reindex/{docId}
            Method: post
        Delete:
          Type: HttpApi
          Properties:
            Path: /documents/{docId}
            Method: delete
        Health:
          Type: HttpApi
          Properties:
            Path: /health
            Method: get

  # Timeout mas alto que el resto: hace map-reduce (1 llamada a Gemini por documento del
  # corpus filtrado + 1 de combinacion final), puede superar los 30s por defecto de Globals.
  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/SemanticSearch.Functions.Reports/
      Handler: SemanticSearch.Functions.Reports::SemanticSearch.Functions.Reports.ReportFunction::FunctionHandler
      Timeout: 120
      Events:
        Create:
          Type: HttpApi
          Properties:
            Path: /reports
            Method: post
        Get:
          Type: HttpApi
          Properties:
            Path: /reports/{reportId}
            Method: get
